# Column aliases, shared across every task.
#
# THIS IS THE FILE YOU EDIT WHEN THE EXPORT DOES NOT MATCH. Every EHR spells the
# same fact differently, and the fix for "no column for patient_id" is an alias
# here -- never a renamed column in the export, because the export is
# regenerated every day by somebody who will not remember to rename it.
#
# Matching is case-insensitive and ignores surrounding whitespace.
columns:
  patient_id: [patient id, patient_id, mrn, medical record number, chart number,
               chart no, patient number, pat id, record id]
  patient_name: [patient name, patient, name, patient_name, pt name, full name,
                 patient full name]
  dob: [dob, date of birth, birth date, birthdate, birth_date, patient dob]
  phone: [phone, phone number, home phone, mobile, cell, contact number,
          primary phone, telephone]
  provider: [provider, physician, doctor, rendering provider, seen by, clinician,
             attending, pcp]
  language: [language, preferred language, primary language, spoken language]
  notes: [notes, note, comment, comments, remarks]
  visit_date: [visit date, date of service, dos, service date, encounter date,
               date, appointment date]
  visit_type: [visit type, appointment type, appt type, reason, type]
  amount: [amount, charge, charge amount, billed, billed amount, total, fee]
  code: [code, cpt, cpt code, procedure code, service code]
