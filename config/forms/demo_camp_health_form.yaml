# A SYNTHETIC camp health form. Not a real document from any organisation.
#
# This repo generates the blank PDF for it (`modules/forms/blankforms.py`), so
# unlike the Illinois certificate its coordinates are MEASURED rather than
# guessed -- they are the same numbers the generator draws the boxes at. That is
# what makes it usable end to end in `make demo-i01` and in the tests without
# anybody opting into placeholder coordinates.
#
# It exists so the pipeline can be exercised honestly. Do not send it to a camp.

form_type: demo_camp_health_form
title: Camp Health Form (SYNTHETIC - demonstration only)
version: "1.0"
issuer: "NSP demonstration fixture - not a real issuing organisation"
page_count: 2
calibration: "generated by modules/forms/blankforms.py; coordinates are exact"
source_pdf: ""

anchors:
  - "camp health form"
  - "synthetic demonstration form"
  - "camper information"
  - "immunizations"

fields:
  # -- camper information (page 1) -----------------------------------
  - name: child_last_name
    kind: text
    label: "Camper last name"
    source: patient.last_name
    transform: verbatim
    required: true
    box:
      page: 1
      x: 200
      y: 120
      width: 150.0
      height: 14.0

  - name: child_first_name
    kind: text
    label: "Camper first name"
    source: patient.first_name
    transform: verbatim
    required: true
    box:
      page: 1
      x: 200
      y: 144
      width: 150.0
      height: 14.0

  - name: date_of_birth
    kind: date
    label: "Date of birth"
    source: patient.date_of_birth
    transform: date_mm_dd_yyyy
    required: true
    box:
      page: 1
      x: 200
      y: 168
      width: 100
      height: 14.0

  - name: parent_guardian
    kind: text
    label: "Parent / guardian"
