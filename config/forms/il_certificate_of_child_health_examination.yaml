# Illinois Certificate of Child Health Examination
#
# The FIELD LIST is public: it mirrors the printed sections of the state form
# (IDPH / ISBE), and getting it right is the part that takes a day.
#
# The BOUNDING BOXES ARE PLACEHOLDERS. Every one carries `placeholder: true`,
# and `TemplateStore.load()` refuses to fill this form until they are measured
# against the real PDF and `calibration:` names who did it. See the module
# docstring in modules/forms/templates.py for why that gate is not optional: a
# date written 40 points low lands in the next row of the immunization grid, the
# form then says a child had a dose they did not have, and a physician signs it.
#
# TO CALIBRATE: open the current IDPH PDF, measure each box in PDF points with
# the origin at the TOP-LEFT of the page, replace x/y/width/height, delete the
# `placeholder: true` line, and fill in `calibration:`.

form_type: il_certificate_of_child_health_examination
title: Certificate of Child Health Examination
version: "PLACEHOLDER - record the IDPH revision date here"
issuer: Illinois Department of Public Health / Illinois State Board of Education
page_count: 4
source_pdf: ""
calibration: ""

# Phrases that appear on this form and are unlikely to appear on a camp or
# sports form. `detect.py` scores an incoming scan against these.
anchors:
  - "certificate of child health examination"
  - "state of illinois"
  - "to be completed by health care provider"
  - "immunization record"
  - "health history"
  - "child's name"
  - "diabetes screening"
  - "lead risk questionnaire"
  - "dental examination"

